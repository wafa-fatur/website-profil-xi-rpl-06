<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak - Kelompok 06</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
      }
      .navbar {
        background-color: #2c3e50;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .navbar .logo {
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
      }
      .navbar ul {
        list-style: none;
        display: flex;
        gap: 20px;
      }
      .navbar ul li a {
        color: #ecf0f1;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
      }
      .navbar ul li a:hover,
      .navbar ul li a.active {
        color: #3498db;
        font-weight: bold;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
        padding: 20px;
      }
      .card {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 5px;
        font-size: 24px;
      }
      .subtitle {
        color: #7f8c8d;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .info-item {
        background-color: #f8f9fa;
        border-left: 4px solid #3498db;
        padding: 12px 15px;
        margin-bottom: 12px;
        border-radius: 4px;
        text-align: left;
      }
      .info-item strong {
        display: block;
        color: #34495e;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .info-item span {
        color: #2c3e50;
        font-size: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">XI RPL - Kelompok 06</div>
      <ul>
        <li><a href="profil.html">Profil</a></li>
        <li><a href="anggota.html">Anggota</a></li>
        <li><a href="kontak.html" class="active">Kontak</a></li>
      </ul>
    </nav>

    <div class="container">
      <div class="card">
        <h1>Hubungi Kami</h1>
        <p class="subtitle">Website Resmi Kelompok 06 - XI RPL1</p>

        <div class="info-item">
          <strong>Email</strong>
          <span>xi.rpl1@example.com</span>
        </div>

        <div class="info-item">
          <strong>Instagram</strong>
          <span>@elevnperfectones</span>
        </div>

        <div class="info-item">
          <strong>Alamat Sekolah</strong>
          <span>Jl. Cimanuk No. 309A, Pataruman, Kecamatan Tarogong Kidul, Kabupaten Garut, Jawa Barat 44151</span>
        </div>
      </div>
    </div>
  </body>
</html>
